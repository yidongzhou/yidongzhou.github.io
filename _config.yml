# Site identity
title: blank
first_name: Yidong
middle_name:
last_name: Zhou
description: >
  Academic website of Yidong Zhou, Assistant Professor in Statistics at the
  University of Minnesota. Research in machine learning, causal inference,
  nonparametric statistics, and functional data analysis, with an emphasis on
  complex and structured data.
footer_text: Statistical methods for complex and structured data.
keywords:
  - Yidong Zhou
  - University of Minnesota
  - Statistics
  - Machine Learning
  - Causal Inference
  - Nonparametric Statistics
  - Functional Data Analysis
  - Fréchet Regression
  - Metric Statistics
  - Random Objects
lang: en
timezone: America/Los_Angeles
icon: YZ

url: https://yidongzhou.github.io
baseurl:
last_updated: true

# Layout
navbar_fixed: true
footer_fixed: false
max_width: 1060px
search_enabled: false
enable_darkmode: true

# Metadata and analytics
serve_og_meta: true
serve_schema_org: true
og_image: https://yidongzhou.github.io/assets/img/profile/prof_pic0.jpg
enable_google_analytics: true
google_analytics: G-X3J500VQQ3
enable_google_verification: true
google_site_verification: fTg53mp9Mkgg9q5ebUjHgzYb2G_cX5YQnQEWCAte7WQ
enable_bing_verification: false

# Approximate visitor locations shown in the footer
visitor_map:
  enabled: true
  provider: MapMyVisitors
  token: fPDd9Y_XCoxruQqIV726apGuxLFBV6-Z_rCMCzqG8pc
  stats_url: https://mapmyvisitors.com/web/1c7f9

# Content
collections:
  news:
    output: false
  photography:
    output: true
    permalink: /photography/:path

news_archive_months: 6
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include:
  - _pages
exclude:
  - bin/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - PHOTOGRAPHY_WORKFLOW.md
  - README.md
  - vendor/

# Build plugins
plugins:
  - jekyll-minifier
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-terser

defaults:
  - scope:
      path: assets
    values:
      sitemap: false
  - scope:
      path: ""
      type: photography
    values:
      layout: photography
      images:
        photoswipe: true

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false

terser:
  compress:
    drop_console: true

# Publications
scholar:
  last_name: [Zhou]
  first_name: [Yidong]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  sort_by: year
  order: descending
  group_by: year
  group_order: descending

filtered_bibtex_keywords:
  - abbr
  - abstract
  - additional_info
  - altmetric
  - annotation
  - arxiv
  - award
  - award_name
  - bibtex_show
  - blog
  - code
  - corresponding_author
  - dimensions
  - equal_contribution
  - google_scholar_id
  - hidden
  - html
  - inspirehep_id
  - pdf
  - poster
  - preview
  - selected
  - slides
  - supp
  - website

max_author_limit: 8
more_authors_animation_delay: 10
enable_publication_thumbnails: false

lazy_loading_images: true

# Only libraries used by the live pages
third_party_libraries:
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap
  jquery:
    integrity:
      js: sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=
    url:
      js: https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js
  photoswipe:
    url:
      css: https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.min.css
      js: https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js
  photoswipe-lightbox:
    url:
      js: https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js
